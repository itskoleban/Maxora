name: Release candidate
on:
  push:
    tags: ['v2.0.0-rc.*']
permissions:
  contents: read
jobs:
  compilation:
    uses: ./.github/workflows/build.yml
  tests:
    uses: ./.github/workflows/tests.yml
  sanitizers:
    uses: ./.github/workflows/sanitizers.yml
  performance:
    uses: ./.github/workflows/performance.yml
  candidate:
    needs: [compilation, tests, sanitizers, performance]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: package-*
          path: dist
          merge-multiple: true
      - name: Verify candidate package identity
        run: |
          python scripts/verify_package.py dist/Maxora-2.0.0-windows-x86.zip --commit "$GITHUB_SHA"
          python scripts/verify_package.py dist/Maxora-2.0.0-linux-x86.zip --commit "$GITHUB_SHA"
      - name: Publish explicitly marked prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          RC_TAG: ${{ github.ref_name }}
        run: gh release create "$RC_TAG" dist/* --verify-tag --prerelease --title "Maxora $RC_TAG" --notes-file docs/release-notes-v2.0.0.md
  artifact-test:
    needs: candidate
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2025
            platform: windows-x86
            binary: rc/components/Maxora.dll
            pawncc: build-pawn/Release/pawncc.exe
            runtime: runtime.zip
          - os: ubuntu-24.04
            platform: linux-x86
            binary: rc/components/Maxora.so
            pawncc: build-pawn/pawncc
            runtime: runtime.tar.gz
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          submodules: recursive
          persist-credentials: false
      - name: Install Linux runtime prerequisites
        if: runner.os == 'Linux'
        run: |
          sudo dpkg --add-architecture i386
          sudo apt-get update
          sudo apt-get install -y libatomic1:i386 libstdc++6:i386
      - name: Download the published candidate
        env:
          GH_TOKEN: ${{ github.token }}
          RC_TAG: ${{ github.ref_name }}
        run: gh release download "$RC_TAG" --pattern 'Maxora-2.0.0-${{ matrix.platform }}.zip*' --dir dist
      - run: python scripts/verify_package.py dist/Maxora-2.0.0-${{ matrix.platform }}.zip --commit "$GITHUB_SHA"
      - run: python -m zipfile -e dist/Maxora-2.0.0-${{ matrix.platform }}.zip rc
      - run: |
          cmake -S lib/compiler/source/compiler -B build-pawn -DCMAKE_POLICY_VERSION_MINIMUM=3.5 -DBUILD_TESTING=OFF -DCMAKE_BUILD_TYPE=Release
          cmake --build build-pawn --config Release --parallel 2 --target pawncc
      - run: python scripts/download_runtime.py --platform ${{ matrix.platform }} --out ${{ matrix.runtime }}
      - run: python scripts/openmp_integration.py --server-archive ${{ matrix.runtime }} --component ${{ matrix.binary }} --pawncc ${{ matrix.pawncc }} --duration 10 --evidence rc-runtime-evidence.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: published-rc-test-${{ matrix.platform }}
          path: |
            rc-runtime-evidence.json
            rc-runtime-evidence.log
