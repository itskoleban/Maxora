name: Sanitizers and parser fuzzing
on:
  workflow_call:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  sanitize:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      CC: clang
      CXX: clang++
      ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
      UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          submodules: recursive
          persist-credentials: false
      - run: cmake -S . -B build -G Ninja -DMAXORA_BUILD_COMPONENT=OFF -DMAXORA_SANITIZERS=ON -DMAXORA_BUILD_FUZZERS=ON -DCMAKE_BUILD_TYPE=Debug
      - run: cmake --build build --parallel 2
      - run: ctest --test-dir build --output-on-failure
      - name: Exercise parser inputs under libFuzzer
        run: |
          mkdir -p corpus
          build/maxora_parser_fuzz corpus -max_total_time=60 -max_len=4096
      - name: Sustained mixed workload under sanitizers
        run: build/maxora_benchmark --seconds 30 > sanitizer-stress.jsonl
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: sanitizer-evidence
          path: |
            sanitizer-stress.jsonl
            build/Testing/Temporary/LastTest.log
