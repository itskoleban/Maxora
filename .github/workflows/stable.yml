name: Stable publication
on:
  workflow_dispatch:
    inputs:
      candidate_tag:
        description: Verified v0.1.0-rc.N to promote without rebuilding
        required: true
        type: string
      authorization:
        description: Type publish verified v0.1.0 after reviewing all production evidence
        required: true
        type: string
permissions:
  contents: read
  actions: read
jobs:
  gate:
    runs-on: ubuntu-24.04
    outputs:
      release_commit: ${{ steps.identity.outputs.commit }}
      windows_sha: ${{ steps.identity.outputs.windows_sha }}
      linux_sha: ${{ steps.identity.outputs.linux_sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: identity
        name: Resolve immutable candidate identity and mandatory evidence
        env:
          RC_TAG: ${{ inputs.candidate_tag }}
          RELEASE_AUTHORIZATION: ${{ inputs.authorization }}
          GH_TOKEN: ${{ github.token }}
        run: |
          test "$RELEASE_AUTHORIZATION" = 'publish verified v0.1.0'
          [[ "$RC_TAG" =~ ^v0\.1\.0-rc\.[0-9]+$ ]]
          SHA=$(git rev-parse "refs/tags/$RC_TAG^{commit}")
          test "$(gh release view "$RC_TAG" --json isPrerelease --jq .isPrerelease)" = true
          gh api "repos/$GITHUB_REPOSITORY/actions/workflows/candidate.yml/runs?head_sha=$SHA&status=success" > candidate-runs.json
          python scripts/release_gate.py --evidence docs/validation/omp-mmdb-stable.json --commit "$SHA" --candidate-tag "$RC_TAG" --candidate-runs candidate-runs.json
          echo "commit=$SHA" >> "$GITHUB_OUTPUT"
          python -c 'import json,os; r=json.load(open("docs/validation/omp-mmdb-stable.json")); f=open(os.environ["GITHUB_OUTPUT"],"a"); f.write("windows_sha="+r["package_sha256"]["windows-x86"]+"\nlinux_sha="+r["package_sha256"]["linux-x86"]+"\n")'
  publish:
    needs: gate
    runs-on: ubuntu-24.04
    environment: production
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Download exact candidate artifacts and verify again
        env:
          GH_TOKEN: ${{ github.token }}
          RC_TAG: ${{ inputs.candidate_tag }}
          RELEASE_COMMIT: ${{ needs.gate.outputs.release_commit }}
          WINDOWS_SHA: ${{ needs.gate.outputs.windows_sha }}
          LINUX_SHA: ${{ needs.gate.outputs.linux_sha }}
        run: |
          gh release download "$RC_TAG" --pattern 'omp-mmdb-0.1.0-*.zip*' --dir dist
          python scripts/verify_package.py dist/omp-mmdb-0.1.0-windows-x86.zip --commit "$RELEASE_COMMIT" --sha "$WINDOWS_SHA"
          python scripts/verify_package.py dist/omp-mmdb-0.1.0-linux-x86.zip --commit "$RELEASE_COMMIT" --sha "$LINUX_SHA"
      - name: Promote validated candidate bytes
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_COMMIT: ${{ needs.gate.outputs.release_commit }}
        run: gh release create v0.1.0 dist/* docs/validation/omp-mmdb-stable.json --target "$RELEASE_COMMIT" --title 'omp-mmdb 0.1.0' --notes-file docs/release-notes-v0.1.0.md
