name: Automated core tests
on:
  workflow_call:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  core:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          submodules: recursive
          persist-credentials: false
      - run: cmake -S . -B build -DMMDB_BUILD_COMPONENT=OFF -DCMAKE_BUILD_TYPE=Release
      - run: cmake --build build --config Release --parallel 2
      - run: ctest --test-dir build -C Release --output-on-failure --output-junit tests.xml
      - name: Validate release tooling
        run: python -m unittest discover -s tests -p test_release_tools.py
