name: Performance and short stress
on:
  workflow_call:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  measure:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          submodules: recursive
          persist-credentials: false
      - run: cmake -S . -B build -G Ninja -DMAXORA_BUILD_COMPONENT=OFF -DCMAKE_BUILD_TYPE=Release
      - run: cmake --build build --parallel 2
      - run: build/maxora_benchmark --iterations 100000 > benchmark.jsonl
      - run: python scripts/check_benchmark.py benchmark.jsonl
      - run: build/maxora_benchmark --seconds 60 > stress.jsonl
      - run: python scripts/check_benchmark.py stress.jsonl --minimum-seconds 60
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: benchmark-evidence
          path: |
            benchmark.jsonl
            stress.jsonl
