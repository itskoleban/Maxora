name: Compilation and packaged runtime tests
on:
  workflow_call:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    name: ${{ matrix.platform }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2025
            platform: windows-x86
            configure: -A Win32
            binary: build/Release/Maxora.dll
            pawncc: build-pawn/Release/pawncc.exe
            runtime: runtime.zip
          - os: ubuntu-24.04
            platform: linux-x86
            configure: -G Ninja -DCMAKE_C_FLAGS=-m32 -DCMAKE_CXX_FLAGS=-m32 -DCMAKE_EXE_LINKER_FLAGS=-m32 -DCMAKE_MODULE_LINKER_FLAGS=-m32
            binary: build/Maxora.so
            pawncc: build-pawn/pawncc
            runtime: runtime.tar.gz
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
          persist-credentials: false
      - name: Install Linux x86 runtime and build prerequisites
        if: runner.os == 'Linux'
        run: |
          sudo dpkg --add-architecture i386
          sudo apt-get update
          sudo apt-get install -y gcc-multilib g++-multilib ninja-build libatomic1:i386 libstdc++6:i386
      - name: Configure release build
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release ${{ matrix.configure }}
      - name: Compile
        run: cmake --build build --config Release --parallel 2
      - name: Execute unit and Pawn boundary tests
        run: ctest --test-dir build -C Release --output-on-failure --output-junit tests.xml
      - name: Compile pinned Pawn compiler
        run: |
          cmake -S lib/compiler/source/compiler -B build-pawn -DCMAKE_POLICY_VERSION_MINIMUM=3.5 -DBUILD_TESTING=OFF -DCMAKE_BUILD_TYPE=Release
          cmake --build build-pawn --config Release --parallel 2 --target pawncc
      - name: Obtain digest-pinned official server
        run: python scripts/download_runtime.py --platform ${{ matrix.platform }} --out ${{ matrix.runtime }}
      - name: Test actual compiled component in open.mp
        run: python scripts/openmp_integration.py --server-archive ${{ matrix.runtime }} --component ${{ matrix.binary }} --pawncc ${{ matrix.pawncc }} --duration 10 --evidence runtime-evidence.json
      - name: Install and package validated binary
        run: |
          cmake --install build --config Release --prefix stage
          python scripts/package.py --stage stage --platform ${{ matrix.platform }} --out dist
          python scripts/verify_package.py dist/Maxora-2.0.0-${{ matrix.platform }}.zip --commit "$GITHUB_SHA"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: package-${{ matrix.platform }}
          path: dist/*
          if-no-files-found: error
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: evidence-${{ matrix.platform }}
          path: |
            runtime-evidence.json
            build/tests.xml
            build/Testing/Temporary/LastTest.log
          if-no-files-found: warn
